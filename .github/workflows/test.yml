# Installs everything on clean macOS and Windows runners from the files on the
# Release page, loads the Employees data, resets the root password, re-runs the
# installer and removes it all again, driving it all through the setup script's
# unattended mode. Run by hand from the Actions tab before each trimester; it
# also catches release assets that have gone wrong. The Windows job runs the
# student side as a standard local user with no administrator rights, so a
# green run proves the home-folder layout needs none; only Workbench's MSI
# (installed beforehand, removed at the end) runs as the administrator.
name: Test installers

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_TAG: v2026-t3
  TEST_PASSWORD: "Te'st\\Pw 9\"#!x"
  SECOND_PASSWORD: "Ne'w\\Pw 7\"#!y"

jobs:
  macos:
    runs-on: macos-15   # Apple Silicon runner
    timeout-minutes: 45
    env:
      MIS781_LOCAL_SCRIPTS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          zsh -n setup.sh install.sh import-employees.sh workbench-connection.sh
          bash -n uninstall-mysql.sh
          # The Python inside the two Workbench connection workers must stay identical.
          diff <(sed -n "/^cat > \"\$SCRIPT\" <<'PY'$/,/^PY$/p" workbench-connection.sh | sed '1d;$d') \
               <(sed -n "/^\$python = @'$/,/^'@$/p" workbench-connection.ps1 | sed '1d;$d')
      - name: Put release files where the installer looks first
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/Downloads"
          gh release download "$RELEASE_TAG" --dir "$HOME/Downloads" \
            --pattern 'mysql-26.10.0-macos15-arm64.tar.gz' \
            --pattern 'mysql-workbench-26.10.0-macos-arm64.zip' \
            --pattern 'test_db-master.zip'
      - name: Scan of a clean machine recommends Install
        env:
          MIS781_ACTION: scan
        run: |
          zsh ./setup.sh | tee scan.log
          grep -q 'MySQL Server      none' scan.log
          grep -q 'Recommended: Install' scan.log
      - name: Install through the setup script
        env:
          MIS781_ACTION: install
          MIS781_ROOT_PASSWORD: ${{ env.TEST_PASSWORD }}
          MIS781_IMPORT: y
        run: zsh ./setup.sh
      - name: Check server, password, data and network binding
        run: |
          M="$HOME/mysql/bin/mysql"
          printf '[client]\nuser=root\nhost=127.0.0.1\npassword="%s"\n' "$(printf '%s' "$TEST_PASSWORD" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')" > /tmp/t.cnf
          "$M" --version
          test "$("$M" --defaults-extra-file=/tmp/t.cnf -N -e 'SELECT COUNT(*) FROM employees.employees')" = 300024
          test "$("$M" --defaults-extra-file=/tmp/t.cnf -N -e 'SELECT COUNT(*) FROM employees.salaries')" = 2844047
          test "$("$M" --defaults-extra-file=/tmp/t.cnf -N -e 'SELECT COUNT(*) FROM information_schema.tables WHERE table_schema="employees"')" = 8
          test "$("$M" --defaults-extra-file=/tmp/t.cnf -N -e 'SELECT @@bind_address')" = 127.0.0.1
          ls -d "/Applications/MySQL Workbench.app"
          grep -q 'mysql/bin' "$HOME/.zshrc"
      - name: Workbench has the MIS781 connection and the saved password
        run: |
          SH="/Applications/MySQL Workbench.app/Contents/Resources/app/shell/bin"
          export MYSQLSH_USER_CONFIG_HOME="$HOME/Library/Application Support/MySQL Workbench/mysqlsh"
          cat > /tmp/wbcheck.py <<'PY'
          import json
          profile = gui.users.get_default_profile(1)["id"]
          found = [c for c in gui.db_connections.list_db_connections(profile) if c["caption"] == "MIS781"]
          assert len(found) == 1, found
          o = found[0]["options"]; o = json.loads(o) if isinstance(o, str) else o
          assert (o["host"], int(o["port"]), o["user"]) == ("127.0.0.1", 3306, "root"), o
          print("MIS781 connection:", o)
          PY
          "$SH/mysqlsh" --py -f /tmp/wbcheck.py
          # Read the password back through the same keychain helper Workbench uses.
          SAVED=$(printf '{"ServerURL":"root@127.0.0.1:3306","SecretType":"password"}' | "$SH/mysql-secret-store-keychain" get | python3 -c 'import json,sys; print(json.load(sys.stdin)["Secret"])')
          test "$SAVED" = "$TEST_PASSWORD"
      - name: Scan of a complete machine recommends Load data
        env:
          MIS781_ACTION: scan
        run: |
          zsh ./setup.sh | tee scan.log
          grep -q 'MySQL Server      ours, running' scan.log
          grep -q 'Recommended: Load' scan.log
      - name: Reset without confirmation changes nothing
        env:
          MIS781_ACTION: reset
          MIS781_NEW_PASSWORD: ${{ env.SECOND_PASSWORD }}
        run: |
          zsh ./setup.sh | tee reset.log
          grep -q 'Nothing was changed' reset.log
          "$HOME/mysql/bin/mysql" --defaults-extra-file=/tmp/t.cnf -N -e 'SELECT 1'
      - name: Reset the root password, data survives
        env:
          MIS781_ACTION: reset
          MIS781_NEW_PASSWORD: ${{ env.SECOND_PASSWORD }}
          MIS781_CONFIRM: yes
        run: |
          zsh ./setup.sh
          M="$HOME/mysql/bin/mysql"
          printf '[client]\nuser=root\nhost=127.0.0.1\npassword="%s"\n' "$(printf '%s' "$SECOND_PASSWORD" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')" > /tmp/t2.cnf
          ! "$M" --defaults-extra-file=/tmp/t.cnf -N -e 'SELECT 1' 2>/dev/null
          test "$("$M" --defaults-extra-file=/tmp/t2.cnf -N -e 'SELECT COUNT(*) FROM employees.employees')" = 300024
          launchctl print "gui/$(id -u)/com.mis781.mysqld" | grep -q 'state = running'
      - name: Reset updated the saved Workbench password
        run: |
          SH="/Applications/MySQL Workbench.app/Contents/Resources/app/shell/bin"
          SAVED=$(printf '{"ServerURL":"root@127.0.0.1:3306","SecretType":"password"}' | "$SH/mysql-secret-store-keychain" get | python3 -c 'import json,sys; print(json.load(sys.stdin)["Secret"])')
          test "$SAVED" = "$SECOND_PASSWORD"
      - name: Re-run changes nothing
        env:
          MIS781_ACTION: install
          MIS781_ROOT_PASSWORD: ${{ env.SECOND_PASSWORD }}
          MIS781_IMPORT: y
        run: zsh ./setup.sh | tee rerun.log && grep -q 'already loaded' rerun.log
      - name: Standalone import script reloads cleanly
        run: |
          "$HOME/mysql/bin/mysql" --defaults-extra-file=/tmp/t2.cnf -e 'DROP DATABASE employees'
          MIS781_CNF=/tmp/t2.cnf MIS781_IMPORT=y zsh ./import-employees.sh
      - name: Remove server without confirmation changes nothing
        env:
          MIS781_ACTION: remove-server
        run: |
          zsh ./setup.sh | tee rm.log
          grep -q 'ours' rm.log
          grep -q 'Nothing was changed' rm.log
          test -d "$HOME/mysql"
      - name: Remove server keeps Workbench and the Employees files
        env:
          MIS781_ACTION: remove-server
          MIS781_CONFIRM: yes
        run: |
          zsh ./setup.sh
          test ! -e "$HOME/mysql"
          test ! -e "$HOME/Library/LaunchAgents/com.mis781.mysqld.plist"
          ! pgrep -x mysqld
          ! grep -q 'MIS781' "$HOME/.zshrc"
          ls -d "/Applications/MySQL Workbench.app"
          test -f "$HOME/MIS781/test_db-master/employees.sql"
          export MYSQLSH_USER_CONFIG_HOME="$HOME/Library/Application Support/MySQL Workbench/mysqlsh"
          "/Applications/MySQL Workbench.app/Contents/Resources/app/shell/bin/mysqlsh" --py -f /tmp/wbcheck.py
          security find-generic-password -a root -s 127.0.0.1:3306 >/dev/null
      - name: Install again reuses Workbench and the files
        env:
          MIS781_ACTION: install
          MIS781_ROOT_PASSWORD: ${{ env.TEST_PASSWORD }}
          MIS781_IMPORT: n
        run: |
          zsh ./setup.sh | tee reinstall.log
          grep -q 'Workbench already installed' reinstall.log
          grep -q 'already has a connection' reinstall.log
          "$HOME/mysql/bin/mysql" --defaults-extra-file=/tmp/t.cnf -N -e 'SELECT 1'
          SH="/Applications/MySQL Workbench.app/Contents/Resources/app/shell/bin"
          SAVED=$(printf '{"ServerURL":"root@127.0.0.1:3306","SecretType":"password"}' | "$SH/mysql-secret-store-keychain" get | python3 -c 'import json,sys; print(json.load(sys.stdin)["Secret"])')
          test "$SAVED" = "$TEST_PASSWORD"
      - name: Remove everything
        env:
          MIS781_ACTION: remove-all
          MIS781_CONFIRM: yes
        run: |
          zsh ./setup.sh
          test ! -e "$HOME/mysql"
          test ! -e "/Applications/MySQL Workbench.app"
          test ! -e "$HOME/Library/Application Support/MySQL/Workbench"
          test ! -e "$HOME/Library/Application Support/MySQL Workbench"
          if security find-generic-password -a root -s 127.0.0.1:3306 >/dev/null 2>&1; then echo "the saved Workbench password is still in the keychain"; exit 1; fi
          test ! -e "$HOME/MIS781"
          test ! -e "$HOME/Downloads/test_db-master.zip"
          ! pgrep -x mysqld

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      STUDENT_PASSWORD: "Stu-dent!Pw-2026-x"
    steps:
      - uses: actions/checkout@v4
      - name: Parse the PowerShell scripts (syntax check)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in 'setup.ps1', 'install.ps1', 'import-employees.ps1', 'uninstall-mysql.ps1', 'workbench-connection.ps1', '.github\windows-student.ps1', '.github\run-as-student.ps1') {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$tokens, [ref]$errors)
            if ($errors.Count) { $errors | ForEach-Object { Write-Host "$f : $_" }; throw "$f has syntax errors" }
            Write-Host "$f parses OK"
          }
          # The new Install path must never ask for elevation or touch a service.
          $install = Get-Content install.ps1 -Raw
          $serverPart = $install.Substring(0, $install.IndexOf('# ---- 4. MySQL Workbench'))
          if ($serverPart -match 'Start-Service|New-Service|sc\.exe') { throw 'install.ps1 server path must not use Windows services' }
          if (([regex]::Matches($serverPart, '-Verb RunAs')).Count -gt 2) { throw 'install.ps1 server path elevates more than the VC++ runtime and the legacy service start' }
      - name: Remove anything MySQL the runner image ships with
        shell: powershell
        run: |
          Get-Service 'MySQL*' -ErrorAction SilentlyContinue | ForEach-Object { Stop-Service $_.Name -Force; sc.exe delete $_.Name }
          if (Test-Path 'C:\Program Files\MySQL') { Remove-Item 'C:\Program Files\MySQL' -Recurse -Force }
          if (Test-Path 'C:\ProgramData\MySQL') { Remove-Item 'C:\ProgramData\MySQL' -Recurse -Force }
          if (Get-NetTCPConnection -LocalPort 3306 -State Listen -ErrorAction SilentlyContinue) { throw 'port 3306 still busy' }
      - name: Install Workbench from the release (the one administrator step)
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download $env:RELEASE_TAG --dir $env:RUNNER_TEMP --pattern 'mysql-workbench-26.10.0-winx64.msi'
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$env:RUNNER_TEMP\mysql-workbench-26.10.0-winx64.msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($p.ExitCode -notin 0, 3010) { throw "Workbench MSI failed with exit code $($p.ExitCode)" }
      - name: Create a standard local user (no administrator rights)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pw = ConvertTo-SecureString $env:STUDENT_PASSWORD -AsPlainText -Force
          New-LocalUser -Name mis781student -Password $pw -PasswordNeverExpires -AccountNeverExpires -UserMayNotChangePassword | Out-Null
          Add-LocalGroupMember -Group Users -Member mis781student
          icacls $env:GITHUB_WORKSPACE /grant "mis781student:(OI)(CI)RX" /T /Q
          icacls $env:RUNNER_TEMP /grant "mis781student:(OI)(CI)M" /T /Q
          Start-Service seclogon -ErrorAction SilentlyContinue
      - name: Scan of a clean machine recommends Install
        shell: powershell
        run: .\.github\run-as-student.ps1 -Step scan-clean
      - name: Install through the setup script, as the student
        shell: powershell
        run: .\.github\run-as-student.ps1 -Step install
      - name: Where did everything go (diagnostics)
        if: failure()
        shell: powershell
        run: |
          .\.github\run-as-student.ps1 -Step diagnostics
          Get-Process mysqld -ErrorAction SilentlyContinue | Format-Table Id, Path
          Get-NetTCPConnection -LocalPort 3306 -ErrorAction SilentlyContinue | Format-Table
          Get-ChildItem $env:RUNNER_TEMP -Filter 'student-*' | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName -Tail 60 }
      - name: Check server, password, data, binding, logon task and PATH
        shell: powershell
        run: .\.github\run-as-student.ps1 -Step check-install
      - name: Workbench has the MIS781 connection and the saved password
        shell: powershell
        run: .\.github\run-as-student.ps1 -Step check-workbench
      - name: Scan of a complete machine recommends Load data
        shell: powershell
        run: .\.github\run-as-student.ps1 -Step scan-complete
      - name: Reset without confirmation changes nothing
        shell: powershell
        run: .\.github\run-as-student.ps1 -Step reset-dry
      - name: Reset the root password, data survives, saved password updated
        shell: powershell
        run: .\.github\run-as-student.ps1 -Step reset
      - name: Re-run changes nothing
        shell: powershell
        run: .\.github\run-as-student.ps1 -Step rerun
      - name: Standalone import script reloads cleanly
        shell: powershell
        run: .\.github\run-as-student.ps1 -Step import-reload
      - name: Remove server without confirmation changes nothing
        shell: powershell
        run: .\.github\run-as-student.ps1 -Step remove-server-dry
      - name: Remove server keeps Workbench, the connection and the Employees files
        shell: powershell
        run: .\.github\run-as-student.ps1 -Step remove-server
      - name: Install again reuses Workbench and the files
        shell: powershell
        run: .\.github\run-as-student.ps1 -Step reinstall
      - name: Remove server again, as the student
        shell: powershell
        run: .\.github\run-as-student.ps1 -Step remove-server-final
      - name: Remove everything (Workbench needs the administrator)
        shell: powershell
        env:
          MIS781_ACTION: remove-all
          MIS781_CONFIRM: yes
          MIS781_LOCAL_SCRIPTS: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Content .\setup.ps1 -Raw | Invoke-Expression
          $wb = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object { $_.PSObject.Properties['DisplayName'] -and $_.DisplayName -like 'MySQL Workbench*' }
          if ($wb) { throw 'Workbench still registered' }
          if (Get-Process mysqld -ErrorAction SilentlyContinue) { throw 'a mysqld is still running' }
          if (Test-Path 'C:\Users\mis781student\mysql') { throw "the student's mysql folder is still there" }
